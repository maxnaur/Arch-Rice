<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Replace Sans-serif -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Comic Sans MS</family>
    </prefer>
  </alias>

  <!-- Replace Serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Comic Sans MS</family>
    </prefer>
  </alias>

  <!-- Monospace default -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>
</fontconfig>
