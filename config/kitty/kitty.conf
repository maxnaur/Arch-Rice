Window layout {{{
  remember_window_size  no
  initial_window_width  640
  initial_window_height 400
#: If enabled, the OS Window size will be remembered so that new instances of kitty will have the same size as the previous instance.
#: If disabled, the OS Window will initially have size configured by initial_window_width/height, in pixels.
#: You can use a suffix of "c" on the width/height values to have them interpreted as number of cells instead of pixels.

  remember_window_position no
#: If enabled, the OS Window position will be remembered so that new instances of kitty will have the same position as the previous instance.
#: If disabled, the OS Window will be placed by the window manager.
#: Note that remembering of position only works if the underlying desktop environment/window manager supports it.
#: It never works on Wayland. See also kitty --position to specify the position when launching kitty.

  enabled_layouts Fat
#: The enabled window layouts. A comma separated list of layout names.
#: The special value all means all layouts. The first listed layout will be used as the startup layout. Default configuration is all layouts in alphabetical order.
#: For a list of available layouts, see the layouts https://sw.kovidgoyal.net/kitty/overview/#layouts
#- Fat -- One (or optionally more) windows are shown full width on the top, the rest of the windows are shown side-by-side on the bottom
#- Grid -- All windows are shown in a grid
#- Horizontal -- All windows are shown side-by-side
#- Splits -- Windows arranged in arbitrary patterns created using horizontal and vertical splits
#- Stack -- Only a single maximized window is shown at a time
#- Tall -- One (or optionally more) windows are shown full height on the left, the rest of the windows are shown one below the other on the right
#- Vertical -- All windows are shown one below the other

  hide_window_decorations yes
#: Hide the window decorations (title-bar and window borders) with yes.
#: On macOS, titlebar-only and titlebar-and-corners can be used to only hide the titlebar and the rounded corners.

#: On Wayland, titlebar-only can be used to hide the titlebar while keeping the window shadow for resizing. On compositors that have server-side decorations (such as anything but GNOME), both yes and titlebar-only force client-side decoration mode.

#: Whether this works and exactly what effect it has depends on the window manager/operating system.
#: Note that the effects of changing this option when reloading config are undefined.
#: When using titlebar-only on macOS, it is useful to also set window_margin_width and placement_strategy to prevent the rounded corners from clipping text. Or use titlebar-and-corners.
}}}


Tab bar {{{
  tab_bar_edge bottom
#: top or bottom.

tab_bar_margin_width 0.0
#: Padding left right

tab_bar_margin_height 0.0 0.0
#: Padding 4 sides up down

  tab_bar_style fade
#: The tab bar style, can be one of:
#: fade -- Each tab's edges fade into the background color (Default)
#: slant -- Tabs look like the tabs in a physical file (KDE default style)
#: separator -- Tabs are separated by a configurable separator. (See also tab_separator)
#: powerline -- Tabs are shown as a continuous line with "fancy" separators. (See also tab_powerline_style)
#: custom -- A user-supplied Python function called draw_tab is loaded from the file tab_bar.py in the kitty config directory. other peoples https://github.com/kovidgoyal/kitty/discussions/4447
#: hidden -- I'm not explaining this

# tab_bar_filter
#: A search expression <https://sw.kovidgoyal.net/kitty/remote-control/#search-syntax>.
#: Only tabs that match this expression will be shown in the tab bar.
#: The currently active tab is always shown, regardless of whether it matches or not.
#: When using this option, the tab bar may be displayed with less tabs than specified in tab_bar_min_tabs, as evaluating the filter is expensive and is done only at display time.
#: This is most useful when using sessions <https://sw.kovidgoyal.net/kitty/sessions/>.
#: An expression of session:~ or session:^$ will show only tabs that belong to the current session or no session.
#: The various tab navigation actions such as goto_tab, next_tab, previous_tab, etc.
#: are automatically restricted to work only on matching tabs.

  tab_bar_align left
#: The horizontal alignment of the tab bar, can be one of: left, center, right.

  tab_bar_min_tabs 2
#: The minimum number of tabs that must exist before the tab bar is
#: shown.

  tab_switch_strategy previous
#: what tab when closed
#: previous -- last used tab.
#: left, right -- close direction
#: last -- right-most tab.

  tab_fade 0.25 0.5 0.75 1
#: Control how each tab fades into the background when using fade for the tab_bar_style.
#: Each number is an alpha (between zero and one) that controls how much the corresponding cell fades into the background, with zero being no fade and one being full fade.
#: You can change the number of cells used by adding/removing entries to this list.

# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"
#: hude level of formating possible but not stored here
}}}


Keyboard shortcuts {{{
#: Keys are identified simply by their lowercase Unicode characters.
#: For example: a for the A key, [ for the left square bracket key, etc.
#: For functional keys, such as Enter or Escape, the names are present at Functional key definitions
#: https://sw.kovidgoyal.net/kitty/keyboard-protocol/#functional.
#: For modifier keys, the names are ctrl, shift, alt, super.

#: Simple shortcut mapping is done with the map directive.
#: For full details on advanced mapping including modal and per application maps, see mapping
#: https://sw.kovidgoyal.net/kitty/mapping/
#: Some quick examples to illustrate common tasks::

#:     # unmap a keyboard shortcut, passing it to the program running in kitty
#:     map kitty_mod+space
#:     # completely ignore a keyboard event
#:     map ctrl+alt+f1 discard_event
#:     # combine multiple actions
#:     map kitty_mod+e combine : new_window : next_layout
#:     # multi-key shortcuts
#:     map ctrl+x>ctrl+y>z action

#: You can browse and trigger these actions by pressing
#: command_palette to run the command palette. The full list of
#: actions that can be mapped to key presses is available here
#: <https://sw.kovidgoyal.net/kitty/actions/>.

  kitty_mod ctrl+shift

#: Special modifier key alias for default shortcuts. You can change the value of this option to alter all default shortcuts that use kitty_mod.

# action_alias

#: E.g. action_alias launch_tab launch --type=tab --cwd=current

#: Define action aliases to avoid repeating the same options in multiple mappings.
#: Aliases can be defined for any action and will be expanded recursively.
#: For example, the above alias allows you to create mappings to launch a new tab in the current working directory without duplication::

#:     map f1 launch_tab vim
#:     map f2 launch_tab emacs

#: Similarly, to alias kitten invocation::

#:     action_alias hints kitten hints --hints-offset=0

# kitten_alias

#: E.g. kitten_alias hints hints --hints-offset=0

#: Like action_alias above, but specifically for kittens. Generally,
#: prefer to use action_alias. This option is a legacy version,
#: present for backwards compatibility. It causes all invocations of
#: the aliased kitten to be substituted. So the example above will
#: cause all invocations of the hints kitten to have the --hints-
#: offset=0 option applied.


Clipboard {{{

#: Copy to clipboard
  map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

#::  There is also a copy_or_interrupt action that can be optionally mapped to Ctrl+C.
#::  It will copy only if there is a selection and send an interrupt otherwise.
#::  Similarly, copy_and_clear_or_interrupt will copy and clear the selection or send an interrupt if there is no selection.
#::  The copy_or_noop action will copy if there is a selection and pass the key through to the application running in the terminal if there is no selection.

#: Paste from clipboard
  map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard

#: Paste from selection (middle click)
  map --allow-fallback=shifted,ascii kitty_mod+s paste_from_selection

#: Pass selection to program
# map --allow-fallback=shifted,ascii kitty_mod+o pass_selection_to_program
  map kitty_mod+o discard_event
}}}


