background {
    monitor =
    path = ~/.config/hypr/lock-screen-walpaper/halls-moving-castal.jpg
    blur_passes = 1
}

general {
    no_fade_in = false              # Enable smooth fade-in animation
    grace = 0                       # Grace period before requiring password
    disable_loading_bar = false     # Show loading indicator
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(LC_TIME=en_GB.UTF-8 date +"%A, %B %d")"
    color = rgba(216, 222, 233, 0.90)
    font_size = 35
    font_family = Lexend
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.90)
    font_size = 130
    font_family = Lexend
    position = 0, 130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 85
    outline_thickness = 2
    dots_size = 0.2                 # Password dot size (0.2-0.8)
    dots_spacing = 0.2              # Spacing between dots (0.0-1.0)
    dots_center = true              # Center dots in field
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Lexend
    placeholder_text = <span foreground="##ffffff99"></span>
    hide_input = false              # Show/hide password dots
    position = 0, -80
    halign = center
    valign = center
}
